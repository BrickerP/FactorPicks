name: VerifyFrontendBuild

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 16

    - name: Install frontend deps
      run: |
        npm install --legacy-peer-deps

    - name: Gatsby build
      run: |
        npx gatsby build --prefix-paths

    - name: Verify stat.json present in public
      run: |
        ls -la public/ | head -20
        ls -la public/stat.json 2>&1 | head -2
