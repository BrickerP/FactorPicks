name: FetchStockDataAndDeploy

on:
  workflow_dispatch:
  schedule:
    - cron:  '10 2 * * *'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install Python dependencies
      run: |
        python -m pip install -r ./.github/fetch_stock_data/requirements.txt

    - name: Fetch stock data (yfinance -> static/stat.json)
      run: |
        python ./.github/fetch_stock_data/fetch_stock_data.py
        ls -la static/ && du -sh static/stat.json

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 16

    - name: Install frontend deps
      run: |
        npm install --legacy-peer-deps

    - name: Gatsby build
      run: |
        npx gatsby build --prefix-paths

    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
